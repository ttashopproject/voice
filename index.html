<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 語音助手 - GitHub 版</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f7f9; display: flex; justify-content: center; height: 100vh; margin: 0; box-sizing: border-box; }
        .container { width: 100%; max-width: 700px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        h2 { color: #1a73e8; margin-bottom: 20px; font-size: 22px; }
        textarea { flex: 1; width: 100%; padding: 20px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 18px; line-height: 1.6; resize: none; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        textarea:focus { border-color: #1a73e8; }
        .controls { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        #startBtn { background: #34a853; color: white; }
        #startBtn.recording { background: #ea4335; animation: pulse 2s infinite; }
        #copyBtn { background: #1a73e8; color: white; }
        #clearBtn { background: #f1f3f4; color: #3c4043; flex: 0.4; }
        .status { font-size: 14px; color: #70757a; margin-top: 15px; text-align: center; font-weight: 500; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="autoStart()">

<div class="container">
    <h2>🎙️ 專屬語音聽寫助手</h2>
    <textarea id="output" placeholder="點擊頁面任何位置即可開始錄音..."></textarea>
    
    <div class="controls">
        <button id="startBtn">🔴 開始錄音</button>
        <button id="copyBtn">📋 複製內容</button>
        <button id="clearBtn">🗑️ 清空</button>
    </div>
    <div id="statusText" class="status">狀態：等待啟動（請先點擊頁面）</div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const statusText = document.getElementById('statusText');
    let isRecording = false;
    let recognition;
    let forceStopped = true;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'zh-HK';

        recognition.onstart = () => {
            isRecording = true;
            forceStopped = false;
            startBtn.innerHTML = '⏹️ 停止錄音';
            startBtn.classList.add('recording');
            statusText.textContent = '🟢 正在錄音：請隨意停頓思考';
            statusText.style.color = "#34a853";
        };

        recognition.onend = () => {
            if (!forceStopped && isRecording) {
                recognition.start(); // 自動重啟實現「永不中斷」
            } else {
                isRecording = false;
                startBtn.innerHTML = '🔴 開始錄音';
                startBtn.classList.remove('recording');
                statusText.textContent = '⚪ 錄音已停止';
                statusText.style.color = "#70757a";
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            insertAtCursor(output, transcript);
        };
    }

    function autoStart() {
        if (!isRecording && recognition) {
            forceStopped = false;
            recognition.start();
        }
    }

    function insertAtCursor(myField, myValue) {
        let startPos = myField.selectionStart;
        let endPos = myField.selectionEnd;
        myField.value = myField.value.substring(0, startPos) + myValue + myField.value.substring(endPos);
        myField.selectionStart = startPos + myValue.length;
        myField.selectionEnd = startPos + myValue.length;
        myField.focus();
    }

    startBtn.onclick = (e) => {
        e.stopPropagation();
        if (isRecording) {
            forceStopped = true;
            recognition.stop();
        } else {
            forceStopped = false;
            recognition.start();
        }
    };

    document.getElementById('copyBtn').onclick = (e) => {
        e.stopPropagation();
        output.select();
        document.execCommand('copy');
        const oldText = statusText.textContent;
        statusText.textContent = '✅ 已成功複製到剪貼簿！';
        setTimeout(() => { statusText.textContent = oldText; }, 2000);
    };

    document.getElementById('clearBtn').onclick = (e) => {
        e.stopPropagation();
        if(output.value && confirm("確定要清空所有內容嗎？")) {
            output.value = '';
            output.focus();
        }
    };

    // 頁面加載後自動 Focus 在輸入框
    window.onload = () => { output.focus(); };
</script>

</body>
</html>
