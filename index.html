<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語音助手 - 精簡版</title>
    <style>
        /* 限定整體網頁背景 */
        body { 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
        }

        /* 限定助手容器的大小 */
        .container { 
            width: 350px; /* 固定寬度 */
            height: 550px; /* 固定高度 */
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* 防止內容溢出 */
        }

        h2 { 
            color: #1a73e8; 
            margin: 0 0 10px 0; 
            font-size: 18px; 
            text-align: center;
        }

        textarea { 
            flex: 1; 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px; 
            line-height: 1.5; 
            resize: none; 
            box-sizing: border-box; 
            outline: none;
        }

        .controls { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin-top: 15px; 
        }

        button { 
            padding: 10px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
        }

        #startBtn { background: #34a853; color: white; grid-column: span 2; }
        #startBtn.recording { background: #ea4335; animation: pulse 2s infinite; }
        #copyBtn { background: #1a73e8; color: white; }
        #clearBtn { background: #dadce0; color: #3c4043; }

        .status { 
            font-size: 12px; 
            color: #70757a; 
            margin-top: 10px; 
            text-align: center; 
            height: 15px;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="autoStart()">

<div class="container">
    <h2>Sammy的語音聽寫助手</h2>
    <textarea id="output" placeholder="點擊此處開始說話..."></textarea>
    
    <div class="controls">
        <button id="startBtn">🔴 開始錄音</button>
        <button id="copyBtn">📋 複製</button>
        <button id="clearBtn">🗑️ 清空</button>
    </div>
    <div id="statusText" class="status">等待啟動...</div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const statusText = document.getElementById('statusText');
    let isRecording = false;
    let recognition;
    let forceStopped = true;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'zh-HK';

        recognition.onstart = () => {
            isRecording = true;
            forceStopped = false;
            startBtn.innerHTML = '⏹️ 停止錄音';
            startBtn.classList.add('recording');
            statusText.textContent = '🟢 正在監聽中...';
        };

        recognition.onend = () => {
            if (!forceStopped && isRecording) {
                recognition.start();
            } else {
                isRecording = false;
                startBtn.innerHTML = '🔴 開始錄音';
                startBtn.classList.remove('recording');
                statusText.textContent = '⚪ 錄音已停止';
            }
        };

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            insertAtCursor(output, transcript);
        };
    }

    function autoStart() {
        if (!isRecording && recognition) {
            forceStopped = false;
            recognition.start();
        }
    }

    function insertAtCursor(myField, myValue) {
        let startPos = myField.selectionStart;
        let endPos = myField.selectionEnd;
        myField.value = myField.value.substring(0, startPos) + myValue + myField.value.substring(endPos);
        myField.selectionStart = startPos + myValue.length;
        myField.selectionEnd = startPos + myValue.length;
        myField.focus();
    }

    startBtn.onclick = (e) => {
        e.stopPropagation();
        if (isRecording) {
            forceStopped = true;
            recognition.stop();
        } else {
            forceStopped = false;
            recognition.start();
        }
    };

    document.getElementById('copyBtn').onclick = (e) => {
        e.stopPropagation();
        output.select();
        document.execCommand('copy');
        statusText.textContent = '✅ 已複製！';
        setTimeout(() => { if(isRecording) statusText.textContent = '🟢 正在監聽中...'; }, 2000);
    };

    document.getElementById('clearBtn').onclick = (e) => {
        e.stopPropagation();
        if(output.value && confirm("清空文字？")) output.value = '';
    };

    window.onload = () => { output.focus(); };
</script>

</body>
</html>
